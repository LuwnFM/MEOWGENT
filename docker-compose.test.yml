services:
  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: meowgent
      POSTGRES_PASSWORD: local-test-password
      POSTGRES_DB: meowgent
    ports:
      - '127.0.0.1:5432:5432'
    volumes:
      - pg-test-data:/var/lib/postgresql/data
  redis:
    image: redis:7-alpine
    ports:
      - '127.0.0.1:6379:6379'
volumes:
  pg-test-data:
