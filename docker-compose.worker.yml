services:
  redis:
    image: redis:7-alpine
    command: redis-server --appendonly yes
    volumes:
      - redis-data:/data
    restart: unless-stopped
  agent-worker:
    build:
      context: .
      dockerfile: Dockerfile.worker
    env_file:
      - .env.worker
    user: root
    volumes:
      - ./skills:/app/skills
      - agent-runtime:/var/lib/agent
    tmpfs:
      - /tmp:size=256m,noexec,nosuid
    mem_limit: 2g
    cpus: 2
    restart: unless-stopped

volumes:
  redis-data:
  agent-runtime: