name: CI

on:
  pull_request:
  workflow_dispatch:

concurrency:
  group: ci-${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install Python dependencies
        run: python -m pip install -r requirements-worker.txt
      - run: python -m unittest discover -s tests -v
      - run: python -m compileall -q skill_registry.py linux_tools.py secops_core_agent.py skills
      - uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: npm
      - run: npm ci
      - name: OpenRouter routing unit tests
        run: node --test tests/openrouter-routing.test.cjs
      - name: TypeScript typecheck
        run: npx tsc --noEmit
      - run: npm run build
